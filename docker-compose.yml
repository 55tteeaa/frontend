services:
  web:
    build: .
    container_name: campus_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./src:/app/src:z
      - ./index.html:/app/index.html:z
    networks:
      - campus-net

networks:
  campus-net:
    external: true
    name: campus-cercetare-net
